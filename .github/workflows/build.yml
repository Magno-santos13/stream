name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Montar projeto
        run: |
          mkdir -p app/src/main/java/com/meustream/app app/src/main/assets
          cp index.html app/src/main/assets/index.html
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'MeuStream'
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.meustream.app'
            compileSdk 34
            defaultConfig {
              applicationId 'com.meustream.app'
              minSdk 21
              targetSdk 34
              versionCode 1
              versionName '1.0'
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-feature android:name="android.hardware.touchscreen" android:required="false"/>
            <uses-feature android:name="android.software.leanback" android:required="false"/>
            <application android:label="Meu Stream" android:icon="@android:drawable/ic_media_play"
              android:banner="@android:drawable/ic_media_play" android:usesCleartextTraffic="true">
              <activity android:name=".MainActivity" android:exported="true"
                android:theme="@android:style/Theme.DeviceDefault.NoActionBar"
                android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                  <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/meustream/app/MainActivity.java <<'EOF'
          package com.meustream.app;
          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
            WebView w; WebChromeClient wc; View custom; WebChromeClient.CustomViewCallback cb;
            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              getWindow().setStatusBarColor(Color.parseColor("#0c1117"));
              getWindow().setNavigationBarColor(Color.parseColor("#0c1117"));
              w = new WebView(this);
              w.setBackgroundColor(0xFF0C1117);
              setContentView(w);
              WebSettings s = w.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setAllowFileAccess(true);
              s.setAllowFileAccessFromFileURLs(true);
              s.setAllowUniversalAccessFromFileURLs(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
              w.setWebViewClient(new WebViewClient());
              wc = new WebChromeClient() {
                @Override public void onShowCustomView(View v, CustomViewCallback c) {
                  if (custom != null) { c.onCustomViewHidden(); return; }
                  custom = v; cb = c;
                  ((ViewGroup) getWindow().getDecorView()).addView(v);
                  getWindow().getDecorView().setSystemUiVisibility(5894);
                }
                @Override public void onHideCustomView() {
                  if (custom == null) return;
                  ((ViewGroup) getWindow().getDecorView()).removeView(custom);
                  custom = null; cb.onCustomViewHidden();
                  getWindow().getDecorView().setSystemUiVisibility(0);
                }
              };
              w.setWebChromeClient(wc);
              w.loadUrl("file:///android_asset/index.html");
            }
            @Override public void onBackPressed() {
              if (custom != null) { wc.onHideCustomView(); return; }
              w.evaluateJavascript("(function(){var p=document.getElementById('pl'),e=document.getElementById('ep');if(!p.classList.contains('hide')){document.getElementById('close').click();return 1}if(!e.classList.contains('hide')){e.classList.add('hide');return 1}return 0})()",
                r -> { if (!"1".equals(r)) finish(); });
            }
          }
          EOF
      - name: Compilar
        run: gradle assembleDebug --no-daemon
      - name: Renomear APK
        run: mv app/build/outputs/apk/debug/app-debug.apk MeuStream.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Meu Stream APK ${{ github.run_number }}
          files: MeuStream.apk
