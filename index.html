<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c1117">
<link rel="manifest" href="manifest.json">
<title>Meu Stream</title>
<style>
:root{--bg:#0c1117;--sf:#151d27;--tx:#e8edf2;--mu:#8a98a8;--ac:#ffb347}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
button,select,input,.card{background:var(--sf);border:2px solid transparent;border-radius:10px;padding:10px 14px}
button{cursor:pointer}
:focus-visible{outline:none;border-color:var(--ac);transform:scale(1.03)}
.hide{display:none!important}
#login{max-width:420px;margin:12vh auto;padding:20px;display:grid;gap:12px}
#login h1{margin:0 0 6px}
#login button{background:var(--ac);color:#111;font-weight:700}
#err{color:#ff7b7b;min-height:1.2em}
header{position:sticky;top:0;background:var(--bg);padding:10px;display:flex;gap:8px;flex-wrap:wrap;z-index:2}
header .sp{flex:1}
nav{display:flex;gap:6px}
nav button.on{background:var(--ac);color:#111;font-weight:700}
.bar{display:flex;gap:8px;padding:0 10px 10px}
.bar input{flex:1;min-width:0}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;padding:0 10px 30px}
.card{padding:0;overflow:hidden;text-align:left;display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:2/3;object-fit:cover;background:#0a0e13}
.live .card img{aspect-ratio:16/10;object-fit:contain;padding:10px}
.card span{padding:8px;font-size:13px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.msg{padding:30px;color:var(--mu)}
#pl{position:fixed;inset:0;background:#000;z-index:5;display:flex;flex-direction:column}
#pl video{flex:1;min-height:0;width:100%}
#pl .t{display:flex;gap:10px;align-items:center;padding:10px;padding-top:max(10px,env(safe-area-inset-top))}
#pl .t b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.epg{padding:8px 12px;font-size:14px;color:var(--mu);max-height:22vh;overflow:auto}.epg b{color:var(--tx)}
#ep{position:fixed;inset:0;background:var(--bg);z-index:4;overflow:auto;padding:10px}
#ep select{margin:8px 0}
#ep .e{display:block;width:100%;text-align:left;margin:6px 0}
</style>
</head>
<body>

<form id="login" onsubmit="return false">
  <h1>Meu Stream</h1>
  <input id="url" placeholder="Link do servidor (https://...)" autocomplete="off" inputmode="url">
  <input id="usr" placeholder="Usuário" autocomplete="username">
  <input id="pwd" type="password" placeholder="Senha" autocomplete="current-password">
  <label><input type="checkbox" id="rem"> Manter conectado neste aparelho</label>
  <button id="go">Entrar</button>
  <div id="err" role="alert"></div>
</form>

<main id="app" class="hide">
  <header>
    <nav id="nav">
      <button data-t="live">TV</button>
      <button data-t="movie">Filmes</button>
      <button data-t="series">Séries</button>
      <button data-t="radio">Rádio</button>
      <button data-t="fav">Favoritos</button>
      <button data-t="cfg">Ajustes</button>
    </nav>
    <span class="sp"></span>
    <button id="out">Sair</button>
  </header>
  <div class="bar">
    <input id="q" type="search" placeholder="Buscar">
    <select id="cat"></select>
  </div>
  <div id="grid"></div>
</main>

<div id="ep" class="hide"></div>
<div id="pl" class="hide">
  <div class="t"><button id="close">Voltar</button><b id="ttl"></b><button id="prv" class="hide" aria-label="Canal anterior">◀</button><button id="nxt" class="hide" aria-label="Próximo canal">▶</button><select id="qual" class="hide" aria-label="Qualidade"></select><button id="fvp" class="hide"></button></div>
  <video id="v" controls autoplay playsinline></video>
  <div id="epg" class="epg"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.15/hls.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const KEY='srv', FK='favs', PK='pos';
let info={}, S=null, tab='live', cache={}, hls=null;
let favs=load(FK)||{};
function load(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}

// ---- API (Xtream Codes) ----
const api=(a,p='')=>fetch(`${S.url}/player_api.php?username=${encodeURIComponent(S.u)}&password=${encodeURIComponent(S.p)}${a?'&action='+a:''}${p}`)
  .then(r=>{if(!r.ok)throw new Error('http');return r.json()});

async function login(s){
  S=s; $('#err').textContent='';
  try{
    const r=await api('');
    if(!r.user_info||String(r.user_info.auth)!=='1')throw new Error('auth');
    if(r.user_info.status&&r.user_info.status!=='Active')throw new Error('exp');
    info=r.user_info;
    if($('#rem').checked)localStorage.setItem(KEY,JSON.stringify(S));
    $('#login').classList.add('hide'); $('#app').classList.remove('hide');
    show('live');
  }catch(e){
    S=null;
    $('#err').textContent=e.message==='exp'?'Conta expirada ou desativada.':e.message==='auth'
      ?'Usuário ou senha incorretos.'
      :'Não foi possível conectar. Confira o link do servidor e se ele aceita acesso pelo navegador (HTTPS/CORS).';
  }
}
$('#go').onclick=()=>{
  let url=$('#url').value.trim().replace(/\/+$/,'');
  if(!url||!$('#usr').value||!$('#pwd').value){$('#err').textContent='Preencha os três campos.';return}
  if(!/^https?:\/\//.test(url))url='https://'+url;
  login({url,u:$('#usr').value.trim(),p:$('#pwd').value});
};
$('#out').onclick=()=>{localStorage.removeItem(KEY);S=null;cache={};location.reload()};

// ---- Dados ----
const MAP={live:['get_live_categories','get_live_streams'],movie:['get_vod_categories','get_vod_streams'],series:['get_series_categories','get_series']};
async function data(t){
  if(!cache[t]){
    $('#grid').innerHTML='<p class="msg">Carregando…</p>';
    const [c,i]=await Promise.all(MAP[t].map(a=>api(a)));
    cache[t]={cats:c||[],items:i||[]};
  }
  return cache[t];
}
const idOf=(t,x)=>t==='series'?x.series_id:x.stream_id;
const imgOf=(t,x)=>x.stream_icon||x.cover||'';

async function show(t){
  tab=t;
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  $('#grid').className=(t==='live'||t==='radio')?'live':'';
  $('#q').value=''; allowed=null;
  $('.bar').classList.toggle('hide',t==='cfg');
  if(t==='cfg')return cfg();
  if(t==='fav'){$('#cat').classList.add('hide');draw();return}
  $('#cat').classList.remove('hide');
  try{
    const d=await data(t==='radio'?'live':t);
    let cats=d.cats;
    if(t==='live'||t==='radio'){
      cats=cats.filter(c=>/r[aá]dio/i.test(c.category_name)===(t==='radio'));
      allowed=new Set(cats.map(c=>String(c.category_id)));
    }
    $('#cat').innerHTML='<option value="">Todas as categorias</option>'+cats.map(c=>`<option value="${c.category_id}">${esc(c.category_name)}</option>`).join('');
    draw();
  }catch(e){$('#grid').innerHTML='<p class="msg">Erro ao carregar. Tente de novo.</p>'}
}
function cfg(){
  const i=info||{}, exp=i.exp_date?new Date(i.exp_date*1000).toLocaleDateString('pt-BR'):'sem limite';
  $('#grid').innerHTML=`<div class="msg" style="grid-column:1/-1;max-width:480px;line-height:2">
    Usuário: <b>${esc(S.u)}</b><br>Vencimento: <b>${exp}</b><br>Conexões: <b>${i.active_cons||0} de ${i.max_connections||'?'}</b><br>
    <button id="c1">Limpar favoritos</button> <button id="c2">Limpar posições salvas</button> <button id="c3">Recarregar listas</button></div>`;
  $('#c1').onclick=e=>{favs={};localStorage.removeItem(FK);e.target.textContent='Feito'};
  $('#c2').onclick=e=>{localStorage.removeItem(PK);e.target.textContent='Feito'};
  $('#c3').onclick=()=>{cache={};show('live')};
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

let cur=[],allowed=null,idx=-1,curSrc=null,lastSave=0;
function draw(){
  const q=$('#q').value.toLowerCase(), c=$('#cat').value;
  let list;
  if(tab==='fav')list=Object.values(favs).map(f=>({...f.item,_t:f.t}));
  else{
    const k=tab==='radio'?'live':tab;
    list=cache[k].items.filter(x=>(!c||String(x.category_id)===c)&&(!allowed||allowed.has(String(x.category_id)))).map(x=>({...x,_t:k}));
  }
  cur=list.filter(x=>!q||String(x.name).toLowerCase().includes(q));
  if(!cur.length){$('#grid').innerHTML='<p class="msg">'+(tab==='fav'?'Nenhum favorito ainda. Use Favoritar dentro do player ou da série.':'Nada encontrado.')+'</p>';return}
  const g=$('#grid'); g.innerHTML='';
  cur=cur.slice(0,300);
  cur.forEach((x,i)=>{
    const b=document.createElement('button'); b.className='card';
    const img=imgOf(x._t,x);
    b.innerHTML=(img?`<img loading="lazy" src="${esc(img)}" alt="" onerror="this.style.visibility='hidden'">`:'<img alt="">')+`<span>${esc(x.name)}</span>`;
    b.onclick=()=>open(x,i);
    g.appendChild(b);
  });
}
$('#nav').onclick=e=>{const t=e.target.dataset.t;if(t)show(t)};
$('#q').oninput=draw; $('#cat').onchange=draw;

// ---- Abrir item ----
function open(x,i){
  idx=i===undefined?-1:i; const t=x._t, id=idOf(t,x);
  if(t==='series')return openSeries(x);
  const src=t==='live'
    ?`${S.url}/live/${S.u}/${S.p}/${id}.m3u8`
    :`${S.url}/movie/${S.u}/${S.p}/${id}.${x.container_extension||'mp4'}`;
  play(src,x.name,x);
}

async function openSeries(x){
  const ep=$('#ep'); ep.classList.remove('hide'); ep.innerHTML='<p class="msg">Carregando…</p>';
  try{
    const info=await api('get_series_info','&series_id='+x.series_id);
    const seasons=info.episodes||{}, keys=Object.keys(seasons);
    ep.innerHTML=`<button id="bk">Voltar</button> <button id="fv">${favs['series'+x.series_id]?'Remover dos favoritos':'Favoritar'}</button>
      <h2>${esc(x.name)}</h2><select id="ss">${keys.map(k=>`<option>${esc(k)}</option>`).join('')}</select><div id="el"></div>`;
    $('#bk').onclick=()=>ep.classList.add('hide');
    $('#fv').onclick=()=>{toggleFav('series',x.series_id,x);$('#fv').textContent=favs['series'+x.series_id]?'Remover dos favoritos':'Favoritar'};
    const list=()=>{
      $('#el').innerHTML='';
      (seasons[$('#ss').value]||[]).forEach(e=>{
        const b=document.createElement('button'); b.className='e';
        b.textContent=`E${e.episode_num}  ${e.title||''}`;
        b.onclick=()=>play(`${S.url}/series/${S.u}/${S.p}/${e.id}.${e.container_extension||'mp4'}`,`${x.name} — T${$('#ss').value} E${e.episode_num}`);
        $('#el').appendChild(b);
      });
    };
    $('#ss').onchange=list; list();
  }catch(e){ep.innerHTML='<button id="bk">Voltar</button><p class="msg">Erro ao carregar a série.</p>';$('#bk').onclick=()=>ep.classList.add('hide')}
}

// ---- Favoritos ----
function toggleFav(t,id,item){
  const k=t+id;
  if(favs[k])delete favs[k]; else favs[k]={t,item};
  localStorage.setItem(FK,JSON.stringify(favs));
}

// ---- Player ----
const b64=t=>{try{return new TextDecoder().decode(Uint8Array.from(atob(t),c=>c.charCodeAt(0)))}catch(e){return t}};
async function epg(id){
  const hm=t=>new Date(t*1000).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  try{
    const l=(await api('get_short_epg','&stream_id='+id+'&limit=4')).epg_listings||[];
    $('#epg').innerHTML=l.length?l.map((e,i)=>`<div>${i?'':'<b>Agora</b> '}${hm(e.start_timestamp)} ${esc(b64(e.title))}</div>`).join(''):'Sem guia de programação para este canal.';
  }catch(e){}
}
function zap(d){const n=idx+d;if(n>=0&&n<cur.length&&cur[n]._t==='live')open(cur[n],n)}
$('#prv').onclick=()=>zap(-1); $('#nxt').onclick=()=>zap(1);
$('#qual').onchange=e=>{if(hls)hls.currentLevel=+e.target.value};
$('#v').ontimeupdate=e=>{
  const v=e.target; if(!curSrc||Date.now()-lastSave<5000)return; lastSave=Date.now();
  const p=load(PK)||{}; if(v.duration-v.currentTime<30)delete p[curSrc]; else p[curSrc]=Math.floor(v.currentTime);
  localStorage.setItem(PK,JSON.stringify(p));
};
function play(src,title,item){
  const v=$('#v'), q=$('#qual'), live=!!item&&item._t==='live';
  $('#ttl').textContent=title; $('#pl').classList.remove('hide'); $('#epg').innerHTML='';
  q.classList.add('hide'); killHls();
  const z=live&&idx>=0; $('#prv').classList.toggle('hide',!z); $('#nxt').classList.toggle('hide',!z);
  if(/\.m3u8/.test(src)&&window.Hls&&Hls.isSupported()){
    hls=new Hls({maxBufferLength:20}); hls.loadSource(src); hls.attachMedia(v);
    hls.on(Hls.Events.MANIFEST_PARSED,(_,d)=>{if(d.levels.length>1){
      q.innerHTML='<option value="-1">Auto</option>'+d.levels.map((l,i)=>`<option value="${i}">${l.height?l.height+'p':Math.round(l.bitrate/1000)+' kbps'}</option>`).join('');
      q.value='-1'; q.classList.remove('hide')}});
    hls.on(Hls.Events.ERROR,(_,d)=>{if(d.fatal){d.type===Hls.ErrorTypes.NETWORK_ERROR?hls.startLoad():hls.recoverMediaError()}});
  }else v.src=src;
  curSrc=live?null:src;
  const pos=!live&&(load(PK)||{})[src];
  if(pos)v.addEventListener('loadedmetadata',()=>{v.currentTime=pos},{once:true});
  v.play().catch(()=>{});
  const f=$('#fvp'), t=item&&item._t;
  f.classList.toggle('hide',!t);
  if(t){const id=idOf(t,item),k=t+id,l=()=>f.textContent=favs[k]?'★ Favorito':'☆ Favoritar';l();f.onclick=()=>{toggleFav(t,id,item);l()}}
  if(live)epg(item.stream_id);
  $('#close').focus();
}
function killHls(){if(hls){hls.destroy();hls=null}}
$('#close').onclick=()=>{const v=$('#v');curSrc=null;v.pause();killHls();v.removeAttribute('src');v.load();$('#pl').classList.add('hide')};
addEventListener('keydown',e=>{
  if(!$('#pl').classList.contains('hide')){if(e.key==='PageUp'||e.key==='ChannelUp')zap(-1);if(e.key==='PageDown'||e.key==='ChannelDown')zap(1)}if(e.key==='Escape'||e.key==='Backspace'&&e.target.tagName!=='INPUT'){
  if(!$('#pl').classList.contains('hide'))$('#close').click();
  else if(!$('#ep').classList.contains('hide'))$('#ep').classList.add('hide')}});

// ---- Início ----
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
const saved=load(KEY);
if(saved){$('#rem').checked=true;login(saved)}
</script>
</body>
</html>
